<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#12131f">
<title>Offline · CA Compliance Tool</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; padding: 16px;
         background: #12131f; color: #e6e8f2; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 420px; text-align: center; border: 2px dashed rgba(148,163,206,.35); border-radius: 24px; padding: 32px 24px; }
  img { width: 64px; height: 64px; }
  h1 { font-size: 1.4rem; margin: 16px 0 8px; }
  p { color: #a3a8bd; line-height: 1.5; margin: 0 0 20px; }
  button { font: inherit; font-weight: 600; border: 0; border-radius: 999px; padding: 10px 22px; background: #8b93f0; color: #14152a; cursor: pointer; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="">
  <h1>You're offline</h1>
  <p>CA Compliance Tool needs an internet connection to sign you in and sync your data. Your clients and tasks are safe; they'll be right where you left them.</p>
  <button onclick="location.reload()">Try again</button>
</main>
<script>addEventListener("online", () => location.reload());</script>
</body>
</html>
